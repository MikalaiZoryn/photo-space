spring:
  application:
    name: photo-space
  datasource:
    # Defaults match compose.yaml for local development. Deployed environments set these via env vars.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/photospace}
    username: ${DB_USERNAME:photospace}
    password: ${DB_PASSWORD:photospace}
  flyway:
    locations: classpath:db/migration
  session:
    # Server-side sessions live in PostgreSQL (V3 migration); Flyway owns the schema.
    jdbc:
      initialize-schema: never

app:
  auth:
    # Google sign-in is enabled only when both are set. Never commit real values; see .env.example.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  # Private photo storage (D11). The defaults match the S3 emulator in compose.yaml. Deployed environments set
  # STORAGE_BUCKET and AWS_REGION, and the aws profile (application-aws.yml) clears the endpoint so real S3 is used.
  storage:
    bucket: ${STORAGE_BUCKET:photo-space-local}
    region: ${AWS_REGION:eu-central-1}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9090}
  # Background jobs (D12). The defaults match the SQS emulator in compose.yaml; the aws profile uses real SQS.
  jobs:
    queue-url: ${JOBS_QUEUE_URL:http://localhost:9324/000000000000/photo-space-jobs}
    region: ${AWS_REGION:eu-central-1}
    sqs-endpoint: ${JOBS_SQS_ENDPOINT:http://localhost:9324}
    dispatcher:
      # The API service runs the dispatcher (D18).
      enabled: ${JOBS_DISPATCHER_ENABLED:true}
      interval: 2s
      batch-size: 20
      stale-after: 15m
    worker:
      # The worker service runs this; the API service turns it off in deployed environments.
      enabled: ${JOBS_WORKER_ENABLED:true}
      wait-time: 20s
      batch-size: 5
      # Must be shorter than the queue's visibility timeout (15 minutes).
      lease: 10m
    retry:
      max-attempts: 5
      base-delay: 30s
      max-delay: 15m
  # Outbound email (D20). Locally, the file provider writes each message as an .eml file and sends nothing. The
  # aws profile defaults to disabled; the stack sets MAIL_PROVIDER=ses and MAIL_FROM when a sender is configured.
  mail:
    provider: ${MAIL_PROVIDER:file}
    from: ${MAIL_FROM:}
    region: ${AWS_REGION:eu-central-1}
    file-directory: ${MAIL_FILE_DIRECTORY:target/dev-mail}
  # Workspace invitations by email (D20). Links in invitation emails point at APP_URL.
  invitations:
    app-url: ${APP_URL:http://localhost:5173}
    valid-for: 7d
    max-pending: 20
    resend-cooldown: 1m
  assets:
    max-upload-bytes: 104857600 # 100 MB
    max-logo-bytes: 5242880 # 5 MB
    workspace-quota-bytes: 107374182400 # 100 GB
    max-pending-uploads: 100
    upload-url-validity: 15m
    view-url-validity: 10m
    max-pixels: 200000000
    preview-size: 2048
    thumbnail-size: 480
    cleanup:
      enabled: ${ASSETS_CLEANUP_ENABLED:true}
      interval: 1h
      abandoned-after: 24h
  # Private galleries and share links (D14).
  galleries:
    max-photos: 500
    max-link-days: 365
    download-url-validity: 5m
  # AI content drafts (D16). The default mock provider needs no account and sends nothing off the machine. With
  # CONTENT_PROVIDER=anthropic, selected photo previews, the notes, and the brand profile go to the Claude API.
  content:
    provider: ${CONTENT_PROVIDER:mock}
    max-photos: 10
    mock-delay: 2s
    # Session plans (Milestone 13): proposed once no new photo has become ready for settle-after.
    plans:
      enabled: ${CONTENT_PLANS_ENABLED:true}
      settle-after: ${CONTENT_PLANS_SETTLE_AFTER:30m}
      lookback: 3d
      interval: 1m
      max-photos: 20
    anthropic:
      # Required with the anthropic provider. Never commit it; see .env.example.
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-5-5}
      effort: medium
      timeout: 120s
      max-tokens: 16000
      # The SDK's own quick retries; the job's backoff handles longer outages (D12).
      max-retries: 1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  servlet:
    session:
      timeout: 12h
      cookie:
        name: SESSION
        http-only: true
        # Browsers accept Secure cookies on http://localhost. Set SESSION_COOKIE_SECURE=false only for local
        # browsers that do not (for example Safari).
        secure: ${SESSION_COOKIE_SECURE:true}
        # Lax, not Strict: the Google callback is a cross-site top-level redirect that needs the session cookie.
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
