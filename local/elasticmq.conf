# Local SQS emulator (ElasticMQ) queues, used by compose.yaml and the backend integration tests.
# They mirror the queues in infra/: a job queue whose messages move to a dead-letter queue after
# 5 receives that never got deleted, with a visibility timeout longer than the worker's lease.
include classpath("application.conf")

queues {
  photo-space-jobs {
    defaultVisibilityTimeout = 900 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "photo-space-jobs-dlq"
      maxReceiveCount = 5
    }
  }
  photo-space-jobs-dlq {
    messageRetentionPeriod = 1209600 seconds
  }
}
