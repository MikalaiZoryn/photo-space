name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The deploy workflow runs these checks first and deploys only if they pass.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from the deploy workflow, this run shares that workflow's concurrency group instead.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test, integration test, package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit tests (Surefire) and Testcontainers integration tests (Failsafe) against PostgreSQL 18 and the
      # S3 and SQS emulators.
      - run: ./mvnw -B verify

  backend-image:
    name: Backend image (docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The image the ECS services run (D18). Built to check the Dockerfile; nothing is pushed.
      - run: docker build -t photo-space-backend:ci backend

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: Infrastructure (typecheck, test, synth)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: infra/.nvmrc
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The stack uploads the built frontend, so synthesis needs it.
      - run: npm ci && npm run build
        working-directory: frontend
      # Synthesizes without AWS credentials; nothing is deployed.
      - run: npx cdk synth -q -c env=staging
